
name: Build D'Fixer POS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dfixer-pos-android-native/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p dfixer-pos-android-native :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfixer-pos-android-debug
          path: dfixer-pos-android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
